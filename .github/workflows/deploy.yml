name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  # ── 1. Build e push das imagens para o Docker Hub (equivalente ao ACR) ─────
  build-and-push:
    name: Build & Push para Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push do Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/empresas-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/empresas-backend:latest

      - name: Build e Push do Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/empresas-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/empresas-frontend:latest

  # ── 2. Deploy no servidor (equivalente ao Web App for Containers) ──────────
  deploy:
    name: Deploy no Servidor
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Puxar imagens e reiniciar containers
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /root/app &&
            echo 'DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}' > .env &&
            echo 'GH_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}' >> .env &&
            echo 'GH_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}' >> .env &&
            echo 'DATABASE_URL=${{ secrets.DATABASE_URL }}' >> .env &&
            echo 'GITHUB_REDIRECT_URI=${{ secrets.GH_REDIRECT_URI }}' >> .env &&
            docker compose pull &&
            docker compose up -d &&
            docker system prune -f
          "

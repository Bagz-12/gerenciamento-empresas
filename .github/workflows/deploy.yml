name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy no servidor via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /root/app &&
            git pull origin main &&
            echo 'GH_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}' > .env.production &&
            echo 'GH_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}' >> .env.production &&
            docker compose down &&
            docker compose up --build -d &&
            docker system prune -f
          "

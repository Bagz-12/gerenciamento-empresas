services:

  # ── Backend FastAPI ───────────────────────────────────────────────────────
  backend:
    image: ${DOCKER_USERNAME}/empresas-backend:latest
    container_name: empresas_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GH_CLIENT_ID: ${GH_CLIENT_ID}
      GH_CLIENT_SECRET: ${GH_CLIENT_SECRET}
    ports:
      - "8000:8000"

  # ── Frontend Vue 3 ────────────────────────────────────────────────────────
  frontend:
    image: ${DOCKER_USERNAME}/empresas-frontend:latest
    container_name: empresas_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

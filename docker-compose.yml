services:

  # ── Banco de dados PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: empresas_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: empresas_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend FastAPI ───────────────────────────────────────────────────────
  backend:
    image: ${DOCKER_USERNAME}/empresas-backend:latest
    container_name: empresas_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/empresas_db
      GH_CLIENT_ID: ${GH_CLIENT_ID}
      GH_CLIENT_SECRET: ${GH_CLIENT_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend Vue 3 ────────────────────────────────────────────────────────
  frontend:
    image: ${DOCKER_USERNAME}/empresas-frontend:latest
    container_name: empresas_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
